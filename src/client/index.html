<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <title>Naturalization Puzzle</title>
    <script>
      // FOUC-prevention: apply persisted theme synchronously before React mounts.
      // localStorage failure must not skip the system-preference fallback.
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('themePreference');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (e) { /* localStorage unavailable; keep default 'system' */ }
        try {
          var resolved = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0f172a' : '#1e40af');
        } catch (e) { /* defensive: never block app startup */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
