name: CI/CD

on:
  push:
    branches: [main, master]
    # Docs-only pushes must NOT trigger this workflow. The workflow's
    # cancel-in-progress concurrency would otherwise abort an in-flight or
    # approval-pending deploy. Listing paths-ignore here is safer than
    # queueing, which could deploy stale bits later.
    #
    # Enumerate doc files explicitly rather than using a `**/*.md` blanket:
    # the Story Mode catalog at `content/stories/*.md` IS product code (the
    # files ship as <EmbeddedResource> in the API DLL — see
    # NaturalizationPuzzle.Api.csproj — so editing one must trigger build,
    # smoke test, and deploy). A blanket `**/*.md` would silently treat
    # story content edits as docs and skip the whole pipeline.
    paths-ignore:
      - 'README.md'
      - 'CONTEXT.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LastSession.md'
      - 'src/client/README.md'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: henrik-me/naturalizationpuzzle

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/client/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --no-restore

      - name: Test .NET
        run: dotnet test --no-build --verbosity normal

      - name: Install frontend dependencies
        working-directory: src/client
        run: npm ci

      - name: Lint frontend
        working-directory: src/client
        run: npm run lint

      - name: Build frontend
        working-directory: src/client
        run: npm run build

      - name: Check frontend bundle size
        working-directory: src/client
        run: npm run size

      - name: Test frontend
        working-directory: src/client
        run: npm test

  e2e:
    name: E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # dorny/paths-filter uses the GitHub API on pull_request events to list
    # changed files, which requires pull-requests: read. Declare the minimal
    # token scope explicitly so a future tightening of the repo's default
    # GITHUB_TOKEN permissions doesn't silently break the filter step.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Detect whether this change touches code paths that warrant a real
      # Playwright run. Docs-only PRs (the explicit doc files listed in
      # on.push.paths-ignore above) skip the ~35s Playwright run but the
      # job still reports success so the required status check on main is
      # satisfied.
      #
      # The pattern list mirrors on.push.paths-ignore above. We use
      # predicate-quantifier: every with negated patterns so a file is
      # considered "code" only when it satisfies ALL exclusions (i.e., it
      # is none of the doc paths). The filter outputs code=true if at
      # least one changed file is non-docs — so mixed docs+code PRs run
      # the full Playwright suite, and only purely docs PRs skip.
      # `content/stories/*.md` is product code (embedded into the API
      # DLL), not docs, so it is intentionally NOT in the exclusion list.
      #
      # The `&docs_paths_filter` YAML anchor below is referenced by the
      # `lighthouse` job's identical filter step so the two stay in sync
      # automatically. Update the list HERE only.
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: &docs_paths_filter |
            code:
              - '!README.md'
              - '!CONTEXT.md'
              - '!CONTRIBUTING.md'
              - '!CODE_OF_CONDUCT.md'
              - '!SECURITY.md'
              - '!LastSession.md'
              - '!src/client/README.md'
              - '!LICENSE'
              - '!.github/copilot-instructions.md'
              - '!.github/instructions/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.gitignore'
              - '!.editorconfig'

      - name: Setup .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            src/client/package-lock.json
            tests/e2e/package-lock.json

      - name: Install client dependencies
        if: steps.filter.outputs.code == 'true'
        working-directory: src/client
        run: npm ci

      - name: Install e2e dependencies
        if: steps.filter.outputs.code == 'true'
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browser (chromium)
        if: steps.filter.outputs.code == 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        if: steps.filter.outputs.code == 'true'
        working-directory: tests/e2e
        # The Playwright config's webServer blocks auto-start the .NET API
        # and Vite dev server. Use --reporter=list explicitly: the default
        # html reporter spawns a blocking server on port 9323 that hangs CI.
        run: npx playwright test --reporter=list

      - name: Upload Playwright test results
        # The list reporter doesn't generate a playwright-report/ directory
        # (only the html reporter does), so we upload only test-results/,
        # which contains traces, screenshots, and videos for failed tests.
        if: failure() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 14

      - name: Skip notice (docs-only)
        if: steps.filter.outputs.code != 'true'
        run: echo "Docs-only change detected — Playwright skipped, required check satisfied."

  lighthouse:
    name: Lighthouse CI
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same rationale as the e2e job above: dorny/paths-filter needs
    # pull-requests:read on pull_request events.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Docs-only PRs skip the Lighthouse run but the job still reports
      # success so the required status check on main is satisfied.
      # Filter list is shared with the e2e job via the `*docs_paths_filter`
      # YAML anchor — update the list in the e2e job, not here.
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: *docs_paths_filter

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/client/package-lock.json

      - name: Install client dependencies
        if: steps.filter.outputs.code == 'true'
        working-directory: src/client
        run: npm ci

      # Lighthouse CI uses the runner's preinstalled `google-chrome-stable`
      # (the ubuntu-latest image ships it). We intentionally do NOT pin Chrome
      # via Playwright here: LHCI has no `chromePath` configured, so it
      # auto-discovers /usr/bin/google-chrome regardless of what Playwright
      # downloads — installing Playwright's Chrome would just be dead weight
      # and would not control browser drift. The runner image's Chrome version
      # is what Lighthouse measures against.

      - name: Build client (production bundle)
        if: steps.filter.outputs.code == 'true'
        working-directory: src/client
        run: npm run build

      # Run vite preview and lhci in the SAME step so the bash process stays
      # alive while the background `vite preview` is serving. GitHub Actions
      # kills any process group spawned by a step at step end, so splitting
      # "start server" and "run client" across two steps leaves no server
      # running by the time the second step starts (verified in an earlier
      # attempt — wait-on timed out at 60s).
      #
      # We do NOT use lhci's built-in `startServerCommand` here because its
      # `startServerReadyPattern` matching is flaky against vite preview's
      # non-tty stdout (ANSI-styled "Local:" banner doesn't reliably match).
      # `wait-on` polls the actual HTTP endpoint instead.
      #
      # LHCI_DISABLE_HTTPS=1 disables the `@vitejs/plugin-basic-ssl` plugin
      # for this preview run (see vite.config.ts) so wait-on / lhci can
      # target the plain-HTTP PREVIEW_URL below without TLS cert juggling.
      #
      # `wait-on` is declared as a devDependency in src/client/package.json
      # (with its exact version locked via package-lock.json), so
      # `npx wait-on` resolves the local node_modules/.bin/wait-on after
      # `npm ci` rather than downloading a fresh copy at every CI run.
      #
      # PREVIEW_PORT and PREVIEW_URL are defined once and reused for the
      # `--port` flag, `wait-on`, and lhci's `--collect.url` override so
      # the port/URL has a single source of truth in this file. The same
      # `--collect.url=...` override is documented in the README's
      # local-run snippet (see "Lighthouse CI (synthetic)") so contributors
      # follow the same pattern locally — `lighthouserc.json` intentionally
      # has no `url` field.
      - name: Run Lighthouse CI (with vite preview)
        if: steps.filter.outputs.code == 'true'
        working-directory: src/client
        env:
          LHCI_DISABLE_HTTPS: "1"
          PREVIEW_PORT: "4173"
        run: |
          PREVIEW_URL="http://127.0.0.1:${PREVIEW_PORT}/"
          npx vite preview --host 127.0.0.1 --port "${PREVIEW_PORT}" --strictPort > vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          npx wait-on --timeout 60000 "${PREVIEW_URL}"
          npx lhci autorun --collect.url="${PREVIEW_URL}"

      - name: Dump vite preview log on failure
        if: failure() && steps.filter.outputs.code == 'true'
        working-directory: src/client
        run: |
          echo "--- vite-preview.log ---"
          [ -f vite-preview.log ] && cat vite-preview.log || echo "(no log file)"

      - name: Upload Lighthouse reports
        if: always() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: src/client/.lighthouseci/
          retention-days: 14
          include-hidden-files: true
          # If lhci crashed before creating .lighthouseci/ (e.g. preview never
          # came up), `if: always()` would otherwise turn a missing-path error
          # in this step into a secondary failure that obscures the real LHCI
          # error. `warn` lets the upload step succeed with a warning so the
          # primary lhci log + vite-preview.log stays the surfaced cause.
          if-no-files-found: warn

      - name: Skip notice (docs-only)
        if: steps.filter.outputs.code != 'true'
        run: echo "Docs-only change detected — Lighthouse CI skipped, required check satisfied."

  # api-benchmark: Layer 2 of issue #97. k6-based per-endpoint load benchmark
  # against a locally-started Release-build API. ADVISORY ONLY — the bench
  # step is `continue-on-error: true` and this job is intentionally NOT in
  # any downstream `needs:` list, so a slow/failed benchmark cannot block
  # deploy. The harness, scenario design, and promotion-to-gating path are
  # documented in tests/perf/README.md.
  api-benchmark:
    name: API Benchmark (k6, advisory)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Restore API
        run: dotnet restore src/api/NaturalizationPuzzle.Api.csproj

      - name: Build API (Release)
        run: dotnet build src/api/NaturalizationPuzzle.Api.csproj -c Release --no-restore

      # Single bash step: start API → wait for /api/health → run k6 →
      # summarize → tear down. We use `trap` so the background dotnet
      # process is killed even on failure; `continue-on-error: true` keeps
      # the bench advisory; `id: bench` lets the upload step always run.
      #
      # Note: we capture k6's exit code rather than letting `set -e` abort
      # the step immediately. If k6 trips a threshold (e.g. the strict
      # `http_req_failed{endpoint:*}: rate==0` correctness sentinel), we
      # still want `summarize.mjs` to produce `k6-summary.md` from the
      # partial results -- that's the artifact a human needs to diagnose
      # WHICH endpoint failed. The step still exits non-zero at the end
      # if k6 failed, so `steps.bench.outcome` remains accurate.
      - name: Run k6 benchmark
        id: bench
        continue-on-error: true
        run: |
          set -euo pipefail
          dotnet run --project src/api/NaturalizationPuzzle.Api.csproj -c Release --no-build --urls http://127.0.0.1:5099 > api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          echo "Waiting for /api/health..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5099/api/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 1
          done
          # Final hard check — exits non-zero if the API never came up.
          curl -fsS http://127.0.0.1:5099/api/health > /dev/null

          set +e
          k6 run tests/perf/api-bench.js
          K6_EXIT=$?
          set -e

          if [ -f tests/perf/k6-results.json ]; then
            node tests/perf/summarize.mjs tests/perf/k6-results.json > tests/perf/k6-summary.md
            echo "--- k6-summary.md ---"
            cat tests/perf/k6-summary.md
          else
            echo "(no k6-results.json produced; skipping summarize)"
          fi

          exit "$K6_EXIT"

      - name: Dump API log on bench failure
        if: always() && steps.bench.outcome == 'failure'
        run: |
          echo "--- api.log ---"
          [ -f api.log ] && cat api.log || echo "(no log file)"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-bench-results
          path: |
            tests/perf/k6-results.json
            tests/perf/k6-summary.md
            tests/perf/k6-stdout.txt
            api.log
          if-no-files-found: warn
          retention-days: 90

  docker-build-push:
    name: Docker Build & Push
    needs: [build-and-test, e2e, lighthouse]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,priority=1000
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  image-smoke-test:
    name: Image Smoke Test
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image and probe health
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          echo "Smoke-testing image: $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name smoke -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            "$IMAGE"

          echo "Waiting for /api/health..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/tmp/health.json 2>/dev/null; then
              echo "Health OK after ${i}s:"
              cat /tmp/health.json
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "::error::Health check did not succeed within 30s"
              docker logs smoke || true
              exit 1
            fi
          done

          echo "Asserting healthy + non-zero question count..."
          jq -e '.status == "healthy" and .database == true and .questionCount > 0' /tmp/health.json

          echo "Asserting /api/v1/states returns non-empty array..."
          curl -fsS http://localhost:8080/api/v1/states | jq -e 'length >= 50'

          echo "Asserting /api/v1/questions returns non-empty array..."
          curl -fsS http://localhost:8080/api/v1/questions | jq -e 'length >= 100'

          # Story Mode catalog smoke check. /api/v1/stories returning [] is a
          # silent regression — /api/health and the question/state assertions
          # all pass because those data paths don't depend on embedded
          # resources. The lower bound 3 matches the Story Mode v1 baseline
          # trio; any catalog shrinkage below that is also a regression worth
          # catching (the test below should be tightened if the baseline
          # ever changes).
          echo "Asserting /api/v1/stories returns at least 3 story entries..."
          curl -fsS http://localhost:8080/api/v1/stories | jq -e 'length >= 3'

          echo "Smoke test passed."

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

  detect-changes:
    name: Detect deployable changes
    needs: [build-and-test, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deploy:
              - 'src/**'
              - 'infra/**'
              - 'content/**'
              - 'Dockerfile'
              - '.github/workflows/ci-cd.yml'
              - 'NaturalizationPuzzle.sln'

  deploy-plan:
    name: Deploy Plan (what-if)
    needs: [image-smoke-test, detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if deployment preview
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          # Use a placeholder for the GHCR token in what-if since the real secret
          # is environment-scoped and not available here. What-if still surfaces
          # all infra changes — only the secret value is shown as ******* either
          # way, which is exactly what we want.
          az deployment sub what-if \
            --location westus2 \
            --name "whatif-${GITHUB_SHA::7}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters ghcrPullToken="placeholder-not-used-in-whatif" \
            --parameters containerImage="ghcr.io/${{ github.repository_owner }}/naturalizationpuzzle:${IMAGE_TAG}" \
            >> "$GITHUB_STEP_SUMMARY"

  deploy-apply:
    name: Deploy Apply (gated)
    needs: [docker-build-push, deploy-plan, detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --location westus2 \
            --name "natpuzzle-prod-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters ghcrPullToken="$GHCR_PULL_TOKEN" \
            --parameters containerImage="ghcr.io/${{ github.repository_owner }}/naturalizationpuzzle:${IMAGE_TAG}" \
            -o none

      - name: Update Container App image and wait for healthy revision
        id: deploy
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          RG=rg-naturalizationpuzzle-prod
          APP=ca-natpuzzle-prod
          IMAGE="ghcr.io/${{ github.repository_owner }}/naturalizationpuzzle:${IMAGE_TAG}"

          echo "Updating $APP -> $IMAGE"
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            -o none

          REV=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestRevisionName -o tsv)
          echo "Latest revision: $REV"

          echo "Waiting for revision to become healthy (up to 5 min)..."
          for i in $(seq 1 60); do
            STATE=$(az containerapp revision show --name "$APP" --resource-group "$RG" --revision "$REV" --query "{prov:properties.provisioningState, health:properties.healthState, replicas:properties.replicas}" -o json)
            echo "[$i] $STATE"
            PROV=$(echo "$STATE" | jq -r .prov)
            HEALTH=$(echo "$STATE" | jq -r .health)
            if [ "$PROV" = "Provisioned" ] && { [ "$HEALTH" = "Healthy" ] || [ "$HEALTH" = "None" ]; }; then
              echo "Revision provisioned (health=$HEALTH)."
              break
            fi
            if [ "$PROV" = "Failed" ]; then
              echo "::error::Revision provisioning failed."
              exit 1
            fi
            sleep 5
          done

          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          URL="https://$FQDN"

          echo "Smoke-testing deployed app: $URL/api/health"
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health" >/tmp/health.json \
              && jq -e '.status == "healthy" and .questionCount > 0' /tmp/health.json >/dev/null; then
              cat /tmp/health.json
              HEALTHY=1
              break
            fi
            sleep 5
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::Deployed app health check failed after 30 attempts."
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

          # Custom-domain probe. Expected hostname is sourced from infra parameters
          # (the source of truth for what *should* be bound) — NOT from the live app
          # state, because if a future deploy wipes the binding the live state would
          # be empty and the check would silently skip. We additionally assert the
          # binding is present on the Container App.
          EXPECTED_HOSTNAME=$(jq -r '.parameters.customDomain.value // ""' infra/main.parameters.json)
          if [ -n "$EXPECTED_HOSTNAME" ]; then
            BOUND_HOSTNAME=$(az containerapp show --name "$APP" --resource-group "$RG" --query "properties.configuration.ingress.customDomains[?name=='$EXPECTED_HOSTNAME'].name | [0]" -o tsv 2>/dev/null || true)
            if [ "$BOUND_HOSTNAME" != "$EXPECTED_HOSTNAME" ]; then
              echo "::error::Expected custom domain '$EXPECTED_HOSTNAME' is NOT bound on $APP after deploy. Bicep customDomains binding was not applied."
              az containerapp show --name "$APP" --resource-group "$RG" --query "properties.configuration.ingress.customDomains" -o json || true
              exit 1
            fi

            CUSTOM_URL="https://$EXPECTED_HOSTNAME"
            echo "Smoke-testing custom domain: $CUSTOM_URL/api/health"
            CUSTOM_HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS "$CUSTOM_URL/api/health" >/tmp/health-custom.json \
                && jq -e '.status == "healthy" and .questionCount > 0' /tmp/health-custom.json >/dev/null; then
                cat /tmp/health-custom.json
                CUSTOM_HEALTHY=1
                break
              fi
              sleep 5
            done
            if [ "$CUSTOM_HEALTHY" != "1" ]; then
              echo "::error::Custom-domain health check failed for $EXPECTED_HOSTNAME (TLS handshake or hostname binding likely broken)."
              cat /tmp/health-custom.json 2>/dev/null || true
              exit 1
            fi
          else
            echo "No customDomain configured in infra/main.parameters.json; skipping custom-domain smoke test."
          fi

          {
            echo "## ✅ Deployed"
            echo ""
            echo "- **Revision:** \`$REV\`"
            echo "- **URL:** $URL"
            if [ -n "$EXPECTED_HOSTNAME" ]; then
              echo "- **Custom domain:** https://$EXPECTED_HOSTNAME"
            fi
            echo "- **Image:** \`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "app-url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
