name: External review policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review]
  push:
    branches: [main]
  workflow_run:
    workflows: ["External review policy signal"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions: {}

concurrency:
  group: external-review-policy
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Evaluate authoritative pull request state
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'POLICY'
          import { createPrivateKey, sign } from "node:crypto";

          export const OWNER = "henrik-me";
          export const REPOSITORY = "NaturalizationPuzzle";
          export const OWNER_ID = 34380746;
          export const CHECK_NAME = "external-review-policy";
          export const POLICY = Object.freeze({
            protectedBases: Object.freeze(["main", "policy-canary"]),
            trustedAuthors: Object.freeze([
              Object.freeze({ login: OWNER, id: OWNER_ID }),
            ]),
            humanApprovers: Object.freeze([
              Object.freeze({ login: OWNER, id: OWNER_ID }),
            ]),
          });
          export const REQUIRED_PERMISSIONS = Object.freeze({
            checks: "write",
            metadata: "read",
            pull_requests: "write",
          });

          const API_VERSION = "2026-03-10";
          const SHA_PATTERN = /^(?:[a-f0-9]{40}|[a-f0-9]{64})$/;
          const LOGIN_PATTERN =
            /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/;
          const BOT_LOGIN_PATTERN =
            /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,98}[A-Za-z0-9])?\[bot\]$/;
          const REVIEW_STATES = new Set([
            "APPROVED",
            "CHANGES_REQUESTED",
            "COMMENTED",
            "DISMISSED",
            "PENDING",
          ]);
          const DECISIVE_REVIEW_STATES = new Set([
            "APPROVED",
            "CHANGES_REQUESTED",
            "DISMISSED",
          ]);
          const TRANSIENT_STATUSES = new Set([502, 503, 504]);
          const MAX_RECONCILIATION_DIAGNOSTICS = 10;

          function requireObject(value, path) {
            if (
              value === null ||
              typeof value !== "object" ||
              Array.isArray(value)
            ) {
              throw new TypeError(`${path}: expected an object`);
            }
            return value;
          }

          function requirePositiveInteger(value, path) {
            if (!Number.isSafeInteger(value) || value < 1) {
              throw new TypeError(`${path}: expected a positive integer`);
            }
            return value;
          }

          function validateAccount(value, path) {
            const account = requireObject(value, path);
            if (!["User", "Bot"].includes(account.type)) {
              throw new TypeError(`${path}.type: invalid value`);
            }
            if (
              typeof account.login !== "string" ||
              !(
                LOGIN_PATTERN.test(account.login) ||
                (account.type === "Bot" &&
                  BOT_LOGIN_PATTERN.test(account.login))
              )
            ) {
              throw new TypeError(`${path}.login: invalid value`);
            }
            return {
              id: requirePositiveInteger(account.id, `${path}.id`),
              login: account.login,
              type: account.type,
            };
          }

          function assertExactPermissions(value, path) {
            const permissions = requireObject(value, path);
            const granted = Object.entries(permissions).filter(
              ([, access]) => access !== "none",
            );
            if (
              granted.length !== 3 ||
              Object.entries(REQUIRED_PERMISSIONS).some(
                ([permission, access]) =>
                  permissions[permission] !== access,
              )
            ) {
              throw new Error(
                `${path}: expected exactly checks:write, metadata:read, pull_requests:write`,
              );
            }
          }

          export function validateAuthoritativePull(input) {
            const pull = requireObject(input, "pull");
            requirePositiveInteger(pull.number, "pull.number");
            if (!["open", "closed"].includes(pull.state)) {
              throw new TypeError("pull.state: invalid value");
            }
            const author = validateAccount(pull.user, "pull.user");
            const headSha = pull.head?.sha;
            if (
              typeof headSha !== "string" ||
              !SHA_PATTERN.test(headSha)
            ) {
              throw new TypeError("pull.head.sha: invalid value");
            }
            let headOwnerId = null;
            if (pull.head?.repo !== null) {
              const headRepository = requireObject(
                pull.head?.repo,
                "pull.head.repo",
              );
              headOwnerId = requirePositiveInteger(
                headRepository.owner?.id,
                "pull.head.repo.owner.id",
              );
              if (
                typeof headRepository.full_name !== "string" ||
                headRepository.full_name.length < 3 ||
                headRepository.full_name.length > 201 ||
                !headRepository.full_name.includes("/")
              ) {
                throw new TypeError(
                  "pull.head.repo.full_name: invalid value",
                );
              }
            }
            const baseRef = pull.base?.ref;
            if (
              typeof baseRef !== "string" ||
              baseRef.length < 1 ||
              baseRef.length > 255
            ) {
              throw new TypeError("pull.base.ref: invalid value");
            }
            if (
              typeof pull.html_url !== "string" ||
              !pull.html_url.startsWith(
                `https://github.com/${OWNER}/${REPOSITORY}/pull/`,
              ) ||
              pull.html_url.length > 500
            ) {
              throw new TypeError("pull.html_url: invalid value");
            }
            return {
              authorId: author.id,
              authorLogin: author.login,
              authorType: author.type,
              baseRef,
              headOwnerId,
              headSha,
            };
          }

          function validateReviews(input) {
            if (!Array.isArray(input) || input.length > 99) {
              throw new TypeError("reviews: expected at most 99 entries");
            }
            return input.map((entry, index) => {
              const path = `reviews[${index}]`;
              const review = requireObject(entry, path);
              requirePositiveInteger(review.id, `${path}.id`);
              if (!REVIEW_STATES.has(review.state)) {
                throw new TypeError(`${path}.state: invalid value`);
              }
              const account =
                review.user === null
                  ? { id: null, login: null, type: null }
                  : validateAccount(review.user, `${path}.user`);
              if (
                review.commit_id !== null &&
                (typeof review.commit_id !== "string" ||
                  !SHA_PATTERN.test(review.commit_id))
              ) {
                throw new TypeError(`${path}.commit_id: invalid value`);
              }
              if (
                review.submitted_at !== null &&
                review.submitted_at !== undefined &&
                (typeof review.submitted_at !== "string" ||
                  !Number.isFinite(Date.parse(review.submitted_at)))
              ) {
                throw new TypeError(
                  `${path}.submitted_at: invalid value`,
                );
              }
              const submittedAt =
                review.submitted_at === null ||
                review.submitted_at === undefined
                  ? null
                  : Date.parse(review.submitted_at);
              if (
                DECISIVE_REVIEW_STATES.has(review.state) &&
                submittedAt === null
              ) {
                throw new TypeError(
                  `${path}.submitted_at: required for a decisive review`,
                );
              }
              return {
                commitId: review.commit_id,
                id: account.id,
                login: account.login,
                reviewId: review.id,
                state: review.state,
                submittedAt,
                type: account.type,
              };
            });
          }

          function isLaterReview(candidate, current) {
            return (
              current === undefined ||
              candidate.submittedAt > current.submittedAt ||
              (candidate.submittedAt === current.submittedAt &&
                candidate.reviewId > current.reviewId)
            );
          }

          export function decidePolicy(pullInput, reviewInput, policy) {
            const pull = validateAuthoritativePull(pullInput);
            const reviews = validateReviews(reviewInput);
            const trusted = policy.trustedAuthors.some(
              ({ login, id }) =>
                pull.authorType === "User" &&
                pull.authorLogin === login &&
                pull.authorId === id &&
                pull.headOwnerId === id,
            );
            if (trusted) {
              return {
                conclusion: "success",
                title: "Trusted author",
                summary:
                  "The immutable trusted owner controls this pull request head.",
                trustedAuthor: true,
              };
            }

            const latestDecisive = new Map();
            for (const review of reviews) {
              const approver = policy.humanApprovers.find(
                ({ login, id }) =>
                  review.login === login && review.id === id,
              );
              if (
                approver &&
                review.type === "User" &&
                review.login !== pull.authorLogin &&
                review.id !== pull.authorId &&
                DECISIVE_REVIEW_STATES.has(review.state)
              ) {
                const current = latestDecisive.get(review.id);
                if (isLaterReview(review, current)) {
                  latestDecisive.set(review.id, review);
                }
              }
            }
            for (const approver of policy.humanApprovers) {
              const review = latestDecisive.get(approver.id);
              if (
                review?.state === "APPROVED" &&
                review.commitId === pull.headSha
              ) {
                return {
                  conclusion: "success",
                  title: "Current-head approval verified",
                  summary:
                    "The allowlisted human owner approved the authoritative current head.",
                  trustedAuthor: false,
                };
              }
            }
            return {
              conclusion: "failure",
              title: "Current-head approval required",
              summary:
                "No effective allowlisted human approval exists for the authoritative current head.",
              trustedAuthor: false,
            };
          }

          export function createAppJwt(appId, privateKeyPem, nowSeconds) {
            if (!Number.isSafeInteger(appId) || appId < 1) {
              throw new TypeError("APP_ID is invalid");
            }
            if (
              typeof privateKeyPem !== "string" ||
              privateKeyPem.length < 100 ||
              privateKeyPem.length > 32_768 ||
              !privateKeyPem.includes("PRIVATE KEY")
            ) {
              throw new TypeError("APP_PRIVATE_KEY is invalid");
            }
            if (!Number.isSafeInteger(nowSeconds) || nowSeconds < 1) {
              throw new TypeError("JWT clock is invalid");
            }
            const encode = (value) =>
              Buffer.from(JSON.stringify(value)).toString("base64url");
            const header = encode({ alg: "RS256", typ: "JWT" });
            const payload = encode({
              iat: nowSeconds - 60,
              exp: nowSeconds + 540,
              iss: appId,
            });
            const signingInput = `${header}.${payload}`;
            const key = createPrivateKey(privateKeyPem);
            const signature = sign(
              "RSA-SHA256",
              Buffer.from(signingInput),
              key,
            );
            return `${signingInput}.${signature.toString("base64url")}`;
          }

          function validateToken(token) {
            if (
              typeof token !== "string" ||
              token.length < 1 ||
              token.length > 4_096 ||
              /[\u0000-\u001f\u007f-\u009f\u2028\u2029]/.test(token)
            ) {
              throw new TypeError("Authentication token is invalid");
            }
          }

          function redact(value, secrets, maximumLength = 2_000) {
            let result = String(value);
            for (const secret of secrets) {
              if (typeof secret === "string" && secret.length >= 4) {
                result = result.replaceAll(secret, "[REDACTED]");
              }
            }
            return result
              .replace(/[\r\n\u0085\u2028\u2029]+/g, " ")
              .replace(
                /[\u0000-\u0009\u000b\u000c\u000e-\u001f\u007f-\u009f]/g,
                "",
              )
              .slice(0, maximumLength);
          }

          function errorDescription(error) {
            return error instanceof Error
              ? `${error.name}: ${error.message}`
              : "Unknown error";
          }

          export class GitHubApi {
            constructor({
              fetchImpl = globalThis.fetch,
              secrets = [],
              timeoutMs = 20_000,
              sleep = (milliseconds) =>
                new Promise((resolve) =>
                  setTimeout(resolve, milliseconds),
                ),
            } = {}) {
              if (typeof fetchImpl !== "function") {
                throw new TypeError("fetch implementation is required");
              }
              this.fetchImpl = fetchImpl;
              this.secrets = secrets;
              this.timeoutMs = timeoutMs;
              this.sleep = sleep;
            }

            async request(
              method,
              path,
              { token, body, expectedStatuses = [200] } = {},
            ) {
              if (!["GET", "POST", "PATCH"].includes(method)) {
                throw new TypeError("Unsupported GitHub API method");
              }
              if (
                typeof path !== "string" ||
                !path.startsWith("/") ||
                path.startsWith("//") ||
                path.length > 2_000
              ) {
                throw new TypeError("GitHub API path is invalid");
              }
              validateToken(token);
              if (
                !Array.isArray(expectedStatuses) ||
                expectedStatuses.length < 1 ||
                expectedStatuses.some(
                  (status) =>
                    !Number.isInteger(status) ||
                    status < 200 ||
                    status > 299,
                )
              ) {
                throw new TypeError("Expected status list is invalid");
              }

              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const controller = new AbortController();
                const timeout = setTimeout(
                  () => controller.abort(),
                  this.timeoutMs,
                );
                let response;
                try {
                  response = await this.fetchImpl(
                    `https://api.github.com${path}`,
                    {
                      method,
                      redirect: "error",
                      signal: controller.signal,
                      headers: {
                        Accept: "application/vnd.github+json",
                        Authorization: ["Bearer", token].join(" "),
                        "Content-Type": "application/json",
                        "User-Agent":
                          "naturalization-puzzle-review-policy/1.0",
                        "X-GitHub-Api-Version": API_VERSION,
                      },
                      body:
                        body === undefined
                          ? undefined
                          : JSON.stringify(body),
                    },
                  );
                } catch (cause) {
                  clearTimeout(timeout);
                  if (
                    method !== "POST" &&
                    attempt < 3 &&
                    cause?.name !== "AbortError"
                  ) {
                    await this.sleep(250 * 2 ** (attempt - 1));
                    continue;
                  }
                  throw new Error(
                    `GitHub API network failure for ${method} ${path}`,
                    { cause },
                  );
                }

                if (expectedStatuses.includes(response.status)) {
                  if (response.status === 204) {
                    clearTimeout(timeout);
                    return null;
                  }
                  let text;
                  try {
                    text = await response.text();
                  } finally {
                    clearTimeout(timeout);
                  }
                  if (text.length > 10_000_000) {
                    throw new Error("GitHub API response exceeded 10 MB");
                  }
                  try {
                    return JSON.parse(text);
                  } catch (cause) {
                    throw new Error("GitHub API returned invalid JSON", {
                      cause,
                    });
                  }
                }

                if (
                  method !== "POST" &&
                  TRANSIENT_STATUSES.has(response.status) &&
                  attempt < 3
                ) {
                  await response.body?.cancel();
                  clearTimeout(timeout);
                  await this.sleep(250 * 2 ** (attempt - 1));
                  continue;
                }
                let errorText;
                try {
                  errorText = (await response.text()).slice(0, 16_384);
                } finally {
                  clearTimeout(timeout);
                }
                throw new Error(
                  `GitHub API ${method} ${path} failed (${response.status}): ${redact(errorText, [token, ...this.secrets])}`,
                );
              }
              throw new Error("GitHub API exhausted transient retries");
            }
          }

          function validateSession(session) {
            requirePositiveInteger(session?.appId, "session.appId");
            if (
              typeof session?.appSlug !== "string" ||
              !/^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$/.test(
                session.appSlug,
              )
            ) {
              throw new TypeError("session.appSlug is invalid");
            }
            validateToken(session?.token);
          }

          // Shared check-run list validation keeps normal upsert and duplicate
          // failure matching identical, so the two paths cannot diverge and
          // both fail closed on truncated pagination or malformed items.
          function validateCheckRunList(list) {
            if (
              list === null ||
              typeof list !== "object" ||
              !Number.isSafeInteger(list.total_count) ||
              list.total_count < 0 ||
              !Array.isArray(list.check_runs) ||
              list.check_runs.length >= 100 ||
              list.total_count > list.check_runs.length
            ) {
              throw new Error(
                "Check-run pagination or response is invalid",
              );
            }
            return list.check_runs.map((check, index) => {
              // app is null for checks whose GitHub App has been deleted or
              // that were not created by an App; such foreign runs are valid
              // and simply never match the dedicated App by id.
              const app = check?.app;
              if (
                check === null ||
                typeof check !== "object" ||
                !Number.isSafeInteger(check.id) ||
                check.id < 1 ||
                typeof check.name !== "string" ||
                typeof check.head_sha !== "string" ||
                (check.external_id !== null &&
                  typeof check.external_id !== "string") ||
                (app !== null &&
                  (typeof app !== "object" ||
                    !Number.isSafeInteger(app.id) ||
                    app.id < 1))
              ) {
                throw new Error(
                  `Check-run list item ${index} is invalid`,
                );
              }
              return check;
            });
          }

          export class GitHubService {
            constructor({
              api,
              appId,
              privateKeyPem,
              now = () => new Date(),
              maskSecret = () => {},
            }) {
              this.api = requireObject(api, "api");
              this.appId = requirePositiveInteger(appId, "appId");
              this.privateKeyPem = privateKeyPem;
              this.now = now;
              this.maskSecret = maskSecret;
            }

            appJwt() {
              const now = this.now();
              if (
                !(now instanceof Date) ||
                !Number.isFinite(now.getTime())
              ) {
                throw new TypeError("Clock returned an invalid date");
              }
              const jwt = createAppJwt(
                this.appId,
                this.privateKeyPem,
                Math.floor(now.getTime() / 1_000),
              );
              this.maskSecret(jwt);
              return jwt;
            }

            async authenticate() {
              const jwt = this.appJwt();
              const app = await this.api.request("GET", "/app", {
                token: jwt,
              });
              const appId = requirePositiveInteger(app?.id, "app.id");
              if (appId !== this.appId) {
                throw new Error("Authenticated App ID mismatch");
              }
              if (!Array.isArray(app.events) || app.events.length !== 0) {
                throw new Error("GitHub App must have no webhook events");
              }
              if (
                typeof app.slug !== "string" ||
                !/^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$/.test(
                  app.slug,
                )
              ) {
                throw new TypeError("Authenticated App slug is invalid");
              }
              assertExactPermissions(app.permissions, "app.permissions");

              const installation = await this.api.request(
                "GET",
                `/repos/${OWNER}/${REPOSITORY}/installation`,
                { token: jwt },
              );
              const installationId = requirePositiveInteger(
                installation?.id,
                "installation.id",
              );
              if (
                installation.account?.login !== OWNER ||
                installation.account?.id !== OWNER_ID
              ) {
                throw new Error("App installation owner mismatch");
              }
              if (installation.repository_selection !== "selected") {
                throw new Error(
                  "App installation must use selected repositories",
                );
              }
              if (installation.suspended_at !== null) {
                throw new Error("App installation is suspended");
              }
              assertExactPermissions(
                installation.permissions,
                "installation.permissions",
              );

              const tokenResponse = await this.api.request(
                "POST",
                `/app/installations/${installationId}/access_tokens`,
                {
                  token: jwt,
                  body: {
                    repositories: [REPOSITORY],
                    permissions: REQUIRED_PERMISSIONS,
                  },
                  expectedStatuses: [201],
                },
              );
              validateToken(tokenResponse?.token);
              if (
                typeof tokenResponse.expires_at !== "string" ||
                !Number.isFinite(
                  Date.parse(tokenResponse.expires_at),
                ) ||
                Date.parse(tokenResponse.expires_at) <=
                  this.now().getTime()
              ) {
                throw new TypeError(
                  "Installation token expiry is invalid",
                );
              }
              assertExactPermissions(
                tokenResponse.permissions,
                "installation token permissions",
              );
              if (
                !Array.isArray(tokenResponse.repositories) ||
                tokenResponse.repositories.length !== 1 ||
                tokenResponse.repositories[0]?.name !== REPOSITORY ||
                tokenResponse.repositories[0]?.full_name !==
                  `${OWNER}/${REPOSITORY}`
              ) {
                throw new Error(
                  "Installation token repository scope mismatch",
                );
              }
              this.maskSecret(tokenResponse.token);
              return {
                appId,
                appSlug: app.slug,
                token: tokenResponse.token,
              };
            }

            async getPull(session, pullNumber) {
              validateSession(session);
              requirePositiveInteger(pullNumber, "pullNumber");
              return this.api.request(
                "GET",
                `/repos/${OWNER}/${REPOSITORY}/pulls/${pullNumber}`,
                { token: session.token },
              );
            }

            async listReviews(session, pullNumber) {
              validateSession(session);
              requirePositiveInteger(pullNumber, "pullNumber");
              const reviews = await this.api.request(
                "GET",
                `/repos/${OWNER}/${REPOSITORY}/pulls/${pullNumber}/reviews?per_page=100`,
                { token: session.token },
              );
              if (!Array.isArray(reviews) || reviews.length >= 100) {
                throw new Error(
                  "Review pagination limit reached; refusing partial data",
                );
              }
              return reviews;
            }

            async listOpenPulls(session) {
              validateSession(session);
              // Explicit full pagination with hard bounds. Fetch per_page=100
              // pages until a page is short (the last page), and fail closed if
              // the final allowed page is still full (there may be more) or any
              // page is malformed. Cross-page duplicate PR numbers are rejected
              // later by the authoritative snapshot before any write.
              const perPage = 100;
              const maxPages = 10;
              const maxRecords = 1_000;
              const collected = [];
              for (let page = 1; page <= maxPages; page += 1) {
                const pageEntries = await this.api.request(
                  "GET",
                  `/repos/${OWNER}/${REPOSITORY}/pulls?state=open&sort=created&direction=asc&per_page=${perPage}&page=${page}`,
                  { token: session.token },
                );
                if (
                  !Array.isArray(pageEntries) ||
                  pageEntries.length > perPage
                ) {
                  throw new Error(
                    "Pull request page is malformed; refusing partial data",
                  );
                }
                for (const entry of pageEntries) {
                  collected.push(entry);
                }
                if (collected.length > maxRecords) {
                  throw new Error(
                    "Pull request record bound exceeded; refusing partial data",
                  );
                }
                if (pageEntries.length < perPage) {
                  return collected;
                }
              }
              // The final allowed page was full: more pages may exist, so we
              // cannot prove we saw every open pull request. Fail closed.
              throw new Error(
                "Pull request pagination bound reached; refusing partial data",
              );
            }

            async failDuplicateHeadChecks(session, headSha, detailsUrl) {
              validateSession(session);
              if (
                typeof headSha !== "string" ||
                !SHA_PATTERN.test(headSha)
              ) {
                throw new TypeError("Duplicate head SHA is invalid");
              }
              if (
                typeof detailsUrl !== "string" ||
                !detailsUrl.startsWith(
                  `https://github.com/${OWNER}/${REPOSITORY}/pull/`,
                ) ||
                detailsUrl.length > 500
              ) {
                throw new TypeError(
                  "Duplicate head detailsUrl is invalid",
                );
              }
              const repositoryPath = `/repos/${OWNER}/${REPOSITORY}`;
              const list = await this.api.request(
                "GET",
                `${repositoryPath}/commits/${headSha}/check-runs?check_name=${CHECK_NAME}&filter=all&per_page=100`,
                { token: session.token },
              );
              const checks = validateCheckRunList(list);
              const matching = checks.filter(
                (check) =>
                  check.name === CHECK_NAME &&
                  check.head_sha === headSha &&
                  check.app !== null &&
                  check.app.id === session.appId,
              );
              const timestamp = this.now().toISOString();
              // Fail every allowlisted-owner PR that shares this commit head:
              // commit-scoped required checks cannot tell them apart, so one
              // PR's success would otherwise satisfy another.
              const output = {
                title: "Duplicate protected pull request heads",
                summary:
                  "Multiple open protected pull requests share this commit " +
                  "as their head. Commit-scoped required checks cannot " +
                  "distinguish them, so every pull request that shares this " +
                  "head is blocked until the heads are made unique.",
              };
              const body = {
                name: CHECK_NAME,
                details_url: detailsUrl,
                status: "completed",
                conclusion: "failure",
                completed_at: timestamp,
                output,
              };
              if (matching.length === 0) {
                await this.api.request(
                  "POST",
                  `${repositoryPath}/check-runs`,
                  {
                    token: session.token,
                    body: {
                      ...body,
                      head_sha: headSha,
                      external_id: `v1:duplicate-head:${headSha}`,
                    },
                    expectedStatuses: [201],
                  },
                );
                return;
              }
              // Omit external_id from PATCH bodies so each run keeps its
              // original identity regardless of which PR minted it. Attempt
              // every matching run with bounded all-settled concurrency and
              // aggregate failures only after all PATCHes have been attempted,
              // so one failing PATCH never leaves a later stale success intact.
              const patchFailures = [];
              for (let offset = 0; offset < matching.length; offset += 5) {
                const batch = matching.slice(offset, offset + 5);
                const settled = await Promise.allSettled(
                  batch.map((check) =>
                    this.api.request(
                      "PATCH",
                      `${repositoryPath}/check-runs/${check.id}`,
                      { token: session.token, body },
                    ),
                  ),
                );
                for (const [index, outcome] of settled.entries()) {
                  if (outcome.status === "rejected") {
                    const reason = outcome.reason;
                    patchFailures.push(
                      reason instanceof Error
                        ? reason
                        : new Error(
                            `Check-run ${batch[index].id} PATCH failed`,
                          ),
                    );
                  }
                }
              }
              if (patchFailures.length > 0) {
                throw new AggregateError(
                  patchFailures,
                  `Failed to fail ${patchFailures.length} duplicate-head check run(s)`,
                );
              }
            }

            // prepareCheck performs the only read a check mutation needs: the
            // check-run list lookup that decides POST-vs-PATCH. It returns a
            // plan that applyCheck can execute with no further reads, so a
            // caller can take a final authoritative snapshot between the lookup
            // and the write. Global workflow concurrency guarantees no other
            // same-App writer races check creation, so the looked-up match set
            // stays valid across the intervening snapshot read.
            async prepareCheck(session, input) {
              validateSession(session);
              const pullNumber = requirePositiveInteger(
                input?.pullNumber,
                "check.pullNumber",
              );
              if (
                typeof input.headSha !== "string" ||
                !SHA_PATTERN.test(input.headSha)
              ) {
                throw new TypeError("check.headSha is invalid");
              }
              if (
                typeof input.detailsUrl !== "string" ||
                !input.detailsUrl.startsWith(
                  `https://github.com/${OWNER}/${REPOSITORY}/pull/`,
                ) ||
                input.detailsUrl.length > 500
              ) {
                throw new TypeError("check.detailsUrl is invalid");
              }
              const externalId =
                `v1:pr${pullNumber}:head:${input.headSha}`;
              const repositoryPath = `/repos/${OWNER}/${REPOSITORY}`;
              const list = await this.api.request(
                "GET",
                `${repositoryPath}/commits/${input.headSha}/check-runs?check_name=${CHECK_NAME}&filter=all&per_page=100`,
                { token: session.token },
              );
              const checks = validateCheckRunList(list);
              const matchingIds = [];
              for (const check of checks) {
                if (
                  check.name === CHECK_NAME &&
                  check.head_sha === input.headSha &&
                  check.external_id === externalId &&
                  check.app !== null &&
                  check.app.id === session.appId
                ) {
                  matchingIds.push(check.id);
                }
              }
              return {
                pullNumber,
                headSha: input.headSha,
                detailsUrl: input.detailsUrl,
                externalId,
                matchingIds,
              };
            }

            // applyCheck executes the prepared mutation with no reads. The
            // window between prepareCheck's list read and this write, and the
            // window between any authoritative snapshot the caller takes and
            // this write, are the only remaining, irreducible races.
            async applyCheck(session, plan, mutation) {
              validateSession(session);
              requireObject(plan, "check.plan");
              if (
                typeof plan.headSha !== "string" ||
                !SHA_PATTERN.test(plan.headSha) ||
                typeof plan.detailsUrl !== "string" ||
                typeof plan.externalId !== "string" ||
                !Array.isArray(plan.matchingIds)
              ) {
                throw new TypeError("check.plan is invalid");
              }
              if (!["in_progress", "completed"].includes(mutation.status)) {
                throw new TypeError("check.status is invalid");
              }
              if (
                mutation.status === "completed" &&
                !["success", "failure"].includes(mutation.conclusion)
              ) {
                throw new TypeError("check.conclusion is invalid");
              }
              for (const [name, maximum] of [
                ["title", 255],
                ["summary", 65_535],
              ]) {
                if (
                  typeof mutation[name] !== "string" ||
                  mutation[name].length < 1 ||
                  mutation[name].length > maximum
                ) {
                  throw new TypeError(`check.${name} is invalid`);
                }
              }
              const repositoryPath = `/repos/${OWNER}/${REPOSITORY}`;
              const timestamp = this.now().toISOString();
              const body = {
                name: CHECK_NAME,
                details_url: plan.detailsUrl,
                external_id: plan.externalId,
                status: mutation.status,
                output: {
                  title: mutation.title,
                  summary: mutation.summary,
                },
                ...(mutation.status === "in_progress"
                  ? { started_at: timestamp }
                  : {
                      conclusion: mutation.conclusion,
                      completed_at: timestamp,
                    }),
              };
              if (plan.matchingIds.length === 0) {
                await this.api.request(
                  "POST",
                  `${repositoryPath}/check-runs`,
                  {
                    token: session.token,
                    body: { ...body, head_sha: plan.headSha },
                    expectedStatuses: [201],
                  },
                );
                return;
              }
              for (const id of plan.matchingIds) {
                await this.api.request(
                  "PATCH",
                  `${repositoryPath}/check-runs/${id}`,
                  { token: session.token, body },
                );
              }
            }

            async upsertCheck(session, input) {
              const plan = await this.prepareCheck(session, {
                pullNumber: input?.pullNumber,
                headSha: input?.headSha,
                detailsUrl: input?.detailsUrl,
              });
              await this.applyCheck(session, plan, {
                status: input?.status,
                conclusion: input?.conclusion,
                title: input?.title,
                summary: input?.summary,
              });
            }
          }

          export class PolicyEvaluator {
            constructor({ github, policy }) {
              this.github = requireObject(github, "github");
              this.policy = requireObject(policy, "policy");
            }

            // Preparation opens an in-progress check for a singleton PR. It
            // does not publish any completed conclusion; the success/failure
            // decision is computed authoritatively at publication time by the
            // reconciler, after the final snapshot, from the final pull plus
            // freshly fetched reviews. The provisional decision returned here is
            // only used to surface early validation failures.
            async prepare(entry, session) {
              const pullNumber = requirePositiveInteger(
                entry?.number,
                "entry.number",
              );
              const detailsUrl = entry?.detailsUrl;
              const headSha = entry?.headSha;
              await this.github.upsertCheck(session, {
                pullNumber,
                headSha,
                detailsUrl,
                status: "in_progress",
                title: "Evaluating external review policy",
                summary:
                  "Fetching authoritative pull request and review data.",
              });
              const reviews = await this.github.listReviews(
                session,
                pullNumber,
              );
              const decision = decidePolicy(
                entry.pull,
                reviews,
                this.policy,
              );
              return {
                pullNumber,
                headSha,
                baseRef: entry?.baseRef,
                detailsUrl,
                decision,
              };
            }
          }

          // Authoritative snapshot: validate the open pull list using unique
          // positive numbers only, refetch each pull via getPull in bounded
          // batches, require a number match, retain only open PRs on protected
          // bases, and group them by authoritative head SHA. Any malformed or
          // duplicate entry, or a number mismatch, fails closed before any
          // check or review write occurs.
          export async function snapshotOpenPulls(github, policy, session) {
            const summaries = await github.listOpenPulls(session);
            if (!Array.isArray(summaries)) {
              throw new TypeError("Open pull request list is invalid");
            }
            const numbers = [];
            const seen = new Set();
            for (const [index, entry] of summaries.entries()) {
              const number = requirePositiveInteger(
                entry?.number,
                `openPulls[${index}].number`,
              );
              if (seen.has(number)) {
                throw new Error(
                  `openPulls[${index}].number: duplicate pull number ${number}`,
                );
              }
              seen.add(number);
              numbers.push(number);
            }
            const retained = [];
            for (let offset = 0; offset < numbers.length; offset += 5) {
              const batch = numbers.slice(offset, offset + 5);
              const fetched = await Promise.all(
                batch.map(async (number) => {
                  const pull = await github.getPull(session, number);
                  const authoritative =
                    validateAuthoritativePull(pull);
                  if (pull.number !== number) {
                    throw new Error(
                      `Authoritative pull number mismatch for ${number}`,
                    );
                  }
                  return { number, pull, authoritative };
                }),
              );
              for (const { number, pull, authoritative } of fetched) {
                if (
                  pull.state !== "open" ||
                  !policy.protectedBases.includes(
                    authoritative.baseRef,
                  )
                ) {
                  continue;
                }
                retained.push({
                  number,
                  pull,
                  state: pull.state,
                  headSha: authoritative.headSha,
                  baseRef: authoritative.baseRef,
                  detailsUrl: pull.html_url,
                });
              }
            }
            const byNumber = new Map();
            const bySha = new Map();
            for (const item of retained) {
              byNumber.set(item.number, item);
              const group = bySha.get(item.headSha);
              if (group) {
                group.push(item);
              } else {
                bySha.set(item.headSha, [item]);
              }
            }
            const duplicateShas = new Set();
            for (const [sha, group] of bySha) {
              if (group.length > 1) {
                duplicateShas.add(sha);
              }
            }
            return { retained, byNumber, bySha, duplicateShas };
          }

          function pickDuplicateDetailsUrl(headSha, snapshots) {
            for (const snapshot of snapshots) {
              const group = snapshot.bySha.get(headSha);
              if (group && group.length > 0) {
                return group[0].detailsUrl;
              }
            }
            return null;
          }

          // Fail every observed duplicated head SHA. Each SHA is attempted at
          // most once per reconciliation (tracked in `attempted`), and every
          // group is attempted even if an earlier one fails, so a single API
          // failure never leaves a later observed stale success in place.
          async function failObservedDuplicates(
            github,
            session,
            duplicateShas,
            snapshots,
            attempted,
            recordError,
          ) {
            for (const headSha of duplicateShas) {
              if (attempted.has(headSha)) {
                continue;
              }
              attempted.add(headSha);
              const detailsUrl = pickDuplicateDetailsUrl(
                headSha,
                snapshots,
              );
              if (detailsUrl === null) {
                continue;
              }
              try {
                await github.failDuplicateHeadChecks(
                  session,
                  headSha,
                  detailsUrl,
                );
              } catch (error) {
                recordError(`duplicate head ${headSha}`, error);
              }
            }
          }

          export async function reconcile(
            github,
            evaluator,
            session,
            secrets = [],
          ) {
            const policy = requireObject(evaluator.policy, "policy");
            const errors = [];
            let failureCount = 0;
            const recordError = (identifier, error) => {
              failureCount += 1;
              if (errors.length < MAX_RECONCILIATION_DIAGNOSTICS) {
                errors.push(
                  new Error(
                    redact(
                      `${identifier}: ${errorDescription(error)}`,
                      secrets,
                      160,
                    ),
                  ),
                );
              }
            };
            const attemptedDuplicates = new Set();

            // Phase 1: authoritative snapshot before any writes.
            const initial = await snapshotOpenPulls(
              github,
              policy,
              session,
            );

            // Phase 2: fail every head that is already duplicated in the
            // initial snapshot immediately, before preparing anything or taking
            // any later snapshot. A subsequent snapshot or API failure can then
            // no longer leave an already-observed stale success in place. Every
            // initial group is attempted before errors are aggregated.
            await failObservedDuplicates(
              github,
              session,
              initial.duplicateShas,
              [initial],
              attemptedDuplicates,
              recordError,
            );

            // Phase 3: prepare singletons only. Initial duplicate groups are
            // quarantined and never prepared, so no success can be minted for
            // a shared head.
            const prepared = [];
            for (
              let offset = 0;
              offset < initial.retained.length;
              offset += 5
            ) {
              const batch = initial.retained.slice(offset, offset + 5);
              const outcomes = await Promise.all(
                batch.map(async (entry) => {
                  if (initial.duplicateShas.has(entry.headSha)) {
                    return { quarantined: true };
                  }
                  try {
                    return {
                      result: await evaluator.prepare(entry, session),
                    };
                  } catch (error) {
                    return {
                      error,
                      identifier: `PR #${entry.number}`,
                    };
                  }
                }),
              );
              for (const outcome of outcomes) {
                if (outcome.result) {
                  prepared.push(outcome.result);
                } else if (outcome.error) {
                  recordError(outcome.identifier, outcome.error);
                }
              }
            }

            // Phase 4: publish each prepared singleton, taking the final
            // authoritative snapshot as the genuine last read before the
            // success check mutation. Per prepared PR, in order:
            //   1. a preliminary fresh snapshot with duplicate detection and
            //      remediation, and an early bail if the PR already changed or
            //      became duplicated;
            //   2. fetch the latest reviews and prepare/validate the exact
            //      check-run mutation (the check-run list lookup) — the last
            //      reads other than the final snapshot;
            //   3. one final complete authoritative snapshot;
            //   4. if the PR/head/base/state or uniqueness changed, or a
            //      duplicate appeared, do not publish success and fail any
            //      observed duplicates;
            //   5. otherwise recompute the decision from the final
            //      authoritative pull plus the already-fetched reviews and
            //      execute the prepared PATCH/POST immediately, with no reads
            //      between the final snapshot and the write.
            //
            // Two races remain and are irreducible at the API level: the final
            // snapshot read to the check write, and the reviews read to the
            // check write. A change landing inside either window is left for
            // the next reconciliation. Global workflow concurrency ensures no
            // other same-App writer races check creation between the check-run
            // list lookup and the write.
            for (const result of prepared) {
              // Step 1: preliminary snapshot and duplicate remediation.
              let prelim;
              try {
                prelim = await snapshotOpenPulls(github, policy, session);
              } catch (error) {
                recordError(`PR #${result.pullNumber}`, error);
                continue;
              }
              await failObservedDuplicates(
                github,
                session,
                prelim.duplicateShas,
                [prelim],
                attemptedDuplicates,
                recordError,
              );
              const prelimEntry = prelim.byNumber.get(result.pullNumber);
              const prelimChanged =
                prelimEntry === undefined ||
                prelimEntry.headSha !== result.headSha ||
                prelimEntry.baseRef !== result.baseRef ||
                prelimEntry.state !== "open" ||
                !policy.protectedBases.includes(prelimEntry.baseRef);
              if (prelimChanged) {
                recordError(
                  `PR #${result.pullNumber}`,
                  new Error(
                    "Authoritative reconciliation mismatch between snapshots; leaving check in progress",
                  ),
                );
                continue;
              }
              if (
                prelim.duplicateShas.has(result.headSha) ||
                (prelim.bySha.get(result.headSha)?.length ?? 0) !== 1
              ) {
                continue;
              }

              // Step 2: fetch reviews and prepare the exact check mutation.
              // These are the final reads before the final snapshot.
              let reviews;
              let plan;
              try {
                reviews = await github.listReviews(
                  session,
                  result.pullNumber,
                );
                plan = await github.prepareCheck(session, {
                  pullNumber: result.pullNumber,
                  headSha: prelimEntry.headSha,
                  detailsUrl: prelimEntry.detailsUrl,
                });
              } catch (error) {
                recordError(`PR #${result.pullNumber}`, error);
                continue;
              }

              // Step 3: the final authoritative snapshot — the last read.
              let finalSnapshot;
              try {
                finalSnapshot = await snapshotOpenPulls(
                  github,
                  policy,
                  session,
                );
              } catch (error) {
                recordError(`PR #${result.pullNumber}`, error);
                continue;
              }
              const finalEntry = finalSnapshot.byNumber.get(
                result.pullNumber,
              );
              const changed =
                finalEntry === undefined ||
                finalEntry.headSha !== result.headSha ||
                finalEntry.baseRef !== result.baseRef ||
                finalEntry.state !== "open" ||
                !policy.protectedBases.includes(finalEntry.baseRef);
              // Any duplicate head group anywhere in the final snapshot — not
              // only this PR's head — blocks publication. A current-unique PR
              // must not publish a success while an unrelated duplicate pair is
              // unresolved in the same authoritative view.
              const anyDuplicate = finalSnapshot.duplicateShas.size > 0;

              // Step 4: on any target change, or ANY duplicate observed in the
              // final snapshot, publish no success this pass. Remediate every
              // duplicate observed (all-settled). A global duplicate fails the
              // whole reconciliation closed and stops all further publication,
              // so the next reconciliation takes a fresh authoritative snapshot
              // before any success can be written.
              if (changed || anyDuplicate) {
                await failObservedDuplicates(
                  github,
                  session,
                  finalSnapshot.duplicateShas,
                  [finalSnapshot],
                  attemptedDuplicates,
                  recordError,
                );
                if (changed) {
                  recordError(
                    `PR #${result.pullNumber}`,
                    new Error(
                      "Authoritative reconciliation mismatch between snapshots; leaving check in progress",
                    ),
                  );
                }
                if (anyDuplicate) {
                  recordError(
                    `PR #${result.pullNumber}`,
                    new Error(
                      "Duplicate protected pull request heads observed in the final authoritative snapshot; deferring all success publication to the next reconciliation",
                    ),
                  );
                  break;
                }
                continue;
              }

              // Step 5: recompute the decision from the final authoritative
              // pull plus the reviews fetched in step 2, then execute the
              // prepared mutation immediately with no intervening reads.
              const decision = decidePolicy(
                finalEntry.pull,
                reviews,
                policy,
              );
              try {
                await github.applyCheck(session, plan, {
                  status: "completed",
                  conclusion: decision.conclusion,
                  title: decision.title,
                  summary: decision.summary,
                });
              } catch (error) {
                recordError(`PR #${result.pullNumber}`, error);
              }
            }

            if (failureCount > 0) {
              throw new AggregateError(
                errors,
                `Reconciliation failed for ${failureCount} pull request(s); retained ${errors.length} diagnostic(s)`,
              );
            }
            return { reconciled: initial.retained.length };
          }

          function requireEnvironment(name, maximumLength) {
            const value = process.env[name];
            if (
              typeof value !== "string" ||
              value.length < 1 ||
              value.length > maximumLength
            ) {
              throw new TypeError(`${name} is missing or invalid`);
            }
            return value;
          }

          export function safeError(error, secrets) {
            let message = errorDescription(error);
            if (
              error instanceof AggregateError &&
              Array.isArray(error.errors)
            ) {
              const diagnostics = error.errors
                .slice(0, MAX_RECONCILIATION_DIAGNOSTICS)
                .map(errorDescription);
              if (diagnostics.length > 0) {
                message =
                  `${message}; diagnostics: ${diagnostics.join(" | ")}`;
              }
            }
            return redact(message, secrets);
          }

          export async function main() {
            const appIdText = requireEnvironment("APP_ID", 20);
            if (!/^[1-9][0-9]{0,15}$/.test(appIdText)) {
              throw new TypeError("APP_ID is invalid");
            }
            const appId = requirePositiveInteger(
              Number(appIdText),
              "APP_ID",
            );
            const privateKeyPem = requireEnvironment(
              "APP_PRIVATE_KEY",
              32_768,
            );
            const eventName = requireEnvironment(
              "GITHUB_EVENT_NAME",
              100,
            );
            if (
              ![
                "pull_request_target",
                "push",
                "schedule",
                "workflow_run",
              ].includes(eventName)
            ) {
              throw new TypeError(`Unsupported event: ${eventName}`);
            }

            const secrets = [privateKeyPem];
            const maskSecret = (secret) => {
              validateToken(secret);
              secrets.push(secret);
              process.stdout.write(`::add-mask::${secret}\n`);
            };
            const api = new GitHubApi({ secrets });
            const github = new GitHubService({
              api,
              appId,
              privateKeyPem,
              maskSecret,
            });
            const session = await github.authenticate();
            const evaluator = new PolicyEvaluator({
              github,
              policy: POLICY,
            });
            return reconcile(github, evaluator, session, secrets);
          }

          export async function runMain() {
            try {
              await main();
            } catch (error) {
              process.stderr.write(
                `::error::${safeError(error, [
                  process.env.APP_PRIVATE_KEY,
                ])}\n`,
              );
              process.exitCode = 1;
            }
          }

          await runMain();
          POLICY
