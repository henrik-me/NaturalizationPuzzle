version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Vite 8.x is blocked by @tailwindcss/vite peer range (accepts ^5.2 || ^6 || ^7).
      # Re-enable when the Tailwind Vite plugin adds Vite 8 support.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6.x requires Vite 8 (peer "^8.0.0"); blocked transitively
      # by the same Tailwind constraint. Re-enable together with Vite 8.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node majors the codebase supports. engines.node in
      # src/client/package.json is the source of truth for which majors are
      # allowed, so block @types/node semver-major bumps and bump it manually in
      # the same PR that widens engines.node to a new supported major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "nuget"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "nuget"
    directory: "/tests/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "tests"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node major bumps for the production image are controlled manually so any
      # change to the supported runtime goes through a deliberate review and
      # stays in sync with engines.node in src/client/package.json. Bump in a
      # dedicated PR alongside engines.node and @types/node when widening the
      # supported Node majors.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
