version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Vite 8.x is blocked by @tailwindcss/vite peer range (accepts ^5.2 || ^6 || ^7).
      # Re-enable when the Tailwind Vite plugin adds Vite 8 support.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6.x requires Vite 8 (peer "^8.0.0"); blocked transitively
      # by the same Tailwind constraint. Re-enable together with Vite 8.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node majors the codebase supports. engines.node in
      # src/client/package.json allows only the LTS-track even majors (22, 24),
      # so block @types/node major bumps that would jump to a non-LTS-track or
      # not-yet-supported major (e.g., 25, 26). When engines.node is widened to
      # include a new LTS major, bump @types/node manually in the same PR.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "nuget"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "nuget"
    directory: "/tests/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "tests"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node major bumps for the production image are controlled manually — only
      # the even-numbered, LTS-track majors (22, 24, 26, ...) are eligible. Odd
      # majors (23, 25, ...) are never on the LTS track and must not ship in the
      # production image. Bump manually in a dedicated PR when the next LTS-track
      # major is ready. Keep this consistent with engines.node in src/client.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
